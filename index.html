<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BaaBye Legal</title>
  <meta name="description" content="Privacy Policy and Terms & Conditions for the BaaBye Android app." />
  <style>
    :root { color-scheme: dark; --bg:#0a0c2e; --card:#14183f; --text:#f7f8ff; --muted:#b9bfd8; --accent:#8fc7ff; --border:#2a3163; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(180deg,#0a0c2e 0%,#111643 100%); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:64px 0; }
    .brand { font-size:2.4rem; margin:0 0 8px; }
    .tagline { color:var(--muted); margin:0 0 32px; line-height:1.6; }
    .card { display:block; padding:22px 24px; margin:14px 0; border:1px solid var(--border); border-radius:18px; background:rgba(20,24,63,.92); color:var(--text); text-decoration:none; }
    .card:hover { border-color:var(--accent); }
    .card h2 { margin:0 0 6px; font-size:1.15rem; }
    .card p { margin:0; color:var(--muted); line-height:1.5; }
    footer { margin-top:34px; color:var(--muted); font-size:.95rem; line-height:1.6; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">BaaBye</h1>
    <p class="tagline">Public legal documents for the BaaBye Android app.</p>

    <a class="card" href="privacy.html">
      <h2>Privacy Policy</h2>
      <p>How BaaBye handles app, session, and Accessibility-related information.</p>
    </a>

    <a class="card" href="terms.html">
      <h2>Terms &amp; Conditions</h2>
      <p>Terms governing use of the BaaBye app.</p>
    </a>

    <footer>
      Support: <a href="mailto:baabye0@gmail.com">baabye0@gmail.com</a>
    </footer>
  </main>
</body>
</html>
